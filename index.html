<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV MALL Warranty - กำลังเปิดระบบ...</title>
  
  <!-- ============================================================ -->
  <!-- ⚠️ สำคัญ: แก้ค่าด้านล่างนี้ก่อนใช้งาน                                -->
  <!-- เปลี่ยน URL ตรง GAS_URL ให้เป็น URL Web App ของคุณ                  -->
  <!-- ============================================================ -->
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzmzMnTNTvFRb6L_96c6mf4QJhs1Ox_QqDbriR73eZoFA-PpXIx3MeEUfoM5hojgVP-5w/exec";
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a2e4a 0%, #1a56a5 100%);
      padding: 20px;
      color: white;
    }
    .container {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .logo {
      width: 90px;
      height: 90px;
      background: rgba(255,255,255,0.15);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      backdrop-filter: blur(10px);
    }
    .logo svg { width: 48px; height: 48px; stroke: white; fill: none; stroke-width: 2; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { font-size: 15px; opacity: 0.85; margin-bottom: 32px; }
    
    .info-box {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: left;
      backdrop-filter: blur(10px);
    }
    .info-box .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
    }
    .info-box .row .label { opacity: 0.8; }
    .info-box .row .value { font-weight: 600; font-family: monospace; }
    
    .btn-primary {
      display: block;
      width: 100%;
      background: white;
      color: #1a2e4a;
      padding: 16px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      text-align: center;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary svg { 
      width: 20px; height: 20px; vertical-align: middle; margin-left: 6px;
      stroke: #1a2e4a; fill: none; stroke-width: 2.5;
    }
    
    .hint {
      font-size: 13px;
      opacity: 0.75;
      margin-top: 16px;
      line-height: 1.6;
    }
    .hint strong { color: #ffd966; }
    
    .error-box {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      backdrop-filter: blur(10px);
    }
    .error-box h3 { font-size: 16px; margin-bottom: 8px; }
    .error-box p { font-size: 13px; opacity: 0.85; line-height: 1.5; }
    
    .footer { margin-top: 28px; font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h1>EV MALL Warranty</h1>
    <p class="subtitle">ระบบลงทะเบียนรับประกันสินค้า</p>
    
    <div id="content"></div>
    
    <div class="footer">
      © EV MALL
    </div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const content = document.getElementById('content');
      
      if (!id || id.trim() === '') {
        content.innerHTML = '<div class="error-box"><h3>⚠️ ไม่พบรหัสรับประกัน</h3><p>ลิงก์นี้ไม่มีรหัสอ้างอิงสินค้า กรุณาสแกน QR Code จากกล่องสินค้าใหม่อีกครั้ง หรือติดต่อเจ้าหน้าที่ค่ะ</p></div>';
        return;
      }
      
      const trimmedId = id.trim();
      const targetUrl = GAS_URL + '?id=' + encodeURIComponent(trimmedId);
      
      const safeId = escapeHtml(trimmedId);
      
      content.innerHTML = 
        '<div class="info-box">' +
          '<div class="row"><span class="label">รหัสอ้างอิงสินค้า</span><span class="value">' + safeId + '</span></div>' +
        '</div>' +
        '<a href="' + targetUrl + '" class="btn-primary" target="_self">' +
          'เข้าสู่ระบบลงทะเบียนประกัน' +
          ' <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>' +
        '</a>' +
        '<p class="hint">👆 กดปุ่มด้านบนเพื่อเปิดหน้ารับประกัน<br/><strong>หากไม่เปิด</strong> กรุณาเปิดลิงก์นี้ผ่าน <strong>Safari</strong> หรือ <strong>Chrome</strong></p>';
    })();
    
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
